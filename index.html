<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEC Workshop-Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
<style>
/* Layout: eine weiße Bühne wie eine DEC-Folie – Olivbalken unter dem Status und am rechten Rand, Logo unten rechts.
   Bewusst nur helles Design (DEC Corporate Design, Logo ist schwarz auf weiß). */
:root {
  --green: #A8B300; --green-dark: #6F7700; --gray: #6E6E6E; --light: #F4F4F4; --white: #FFFFFF; --black: #000000;
  --line: #DEDEDE; --warn: #E08A00; --over: #C8352B;
  --font: "Poppins", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--white); color: var(--black); font-family: var(--font); font-weight: 300; font-size: 15px; margin: 0; }

.stage { --state: var(--black); position: relative; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
  justify-content: center; gap: 1.5rem; padding: 6rem calc(clamp(16px, 5vw, 5rem) + 12px) 6rem clamp(16px, 5vw, 5rem); }
.stage::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 12px; background: var(--green); }
.stage[data-state="warn"] { --state: var(--warn); }
.stage[data-state="over"] { --state: var(--over); }
.stage[data-state="paused"] { --state: var(--gray); }

.wordmark { position: absolute; top: .4rem; left: calc(clamp(16px, 5vw, 5rem) - 1.6rem); width: 240px; max-width: 60%; height: auto; }
.status { font-size: clamp(1.2rem, 2.4vw, 2rem); font-weight: 600; margin: 0; }
.stage[data-state="over"] .status { color: var(--over); }
.title-bar { width: min(100%, 22rem); height: 8px; background: var(--green); margin-top: .7rem; }

.clock { font-weight: 600; line-height: 1; font-size: clamp(5rem, 24vw, 24rem); color: var(--state);
  transition: color .4s; white-space: nowrap; }
.clock .d { display: inline-block; width: .64em; text-align: center; }
.clock .s { display: inline-block; width: .3em; text-align: center; }
.stage[data-state="over"] .clock { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.bar { height: 14px; background: var(--light); overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--green); transition: width .25s linear, background .4s; }
.stage[data-state="warn"] .bar-fill { background: var(--warn); }
.stage[data-state="over"] .bar-fill { background: var(--over); }

.blocks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; max-width: 46rem; }
.block { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem; padding: .9rem 1.1rem; text-align: left; }
.block b { font-size: clamp(1.6rem, 3.4vw, 2.4rem); font-weight: 600; line-height: 1; }
.block span { font-size: .8rem; color: var(--gray); }
.block[aria-pressed="true"] { border-color: var(--green); box-shadow: inset 0 -6px 0 var(--green); }

.controls, .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
button { font: inherit; font-weight: 400; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
  background: var(--white); color: var(--black); padding: .7rem 1rem; }
button:hover { border-color: var(--gray); }
button:focus-visible { outline: 3px solid var(--green-dark); outline-offset: 2px; }
.primary { background: var(--green); border-color: var(--green); font-weight: 600; min-width: 9rem; font-size: 1.1rem; }
.primary:hover { border-color: var(--black); }
.chip { padding: .45rem .85rem; border-radius: 999px; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--black); color: var(--white); border-color: var(--black); }
.keys { font-size: .78rem; color: var(--gray); }
kbd { font-family: var(--font); font-size: .72rem; font-weight: 600; padding: .05rem .35rem; border: 1px solid var(--line); border-radius: 4px; color: var(--black); }

.logo-icon { position: absolute; right: calc(clamp(16px, 5vw, 5rem) + 12px); bottom: 1.2rem; height: 52px; width: auto; }

/* Vollbild: nur Uhr, Balken und Blöcke */
:fullscreen .row, :fullscreen .keys { display: none; }
@media (max-width: 600px) {
  .blocks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .keys { display: none; }
  .wordmark { width: 180px; }
}
@media (prefers-reduced-motion: reduce) {
  .bar-fill, .clock { transition: none; }
  .stage[data-state="over"] .clock { animation: none; }
}
</style>
</head>
<body>


<main class="stage" id="stage" data-state="idle">
  <img class="wordmark" src="dec-wortmarke.png" alt="Dehn Consulting – Iterate the next normal">
  <div>
    <p class="status" id="status">Bereit</p>
    <div class="title-bar"></div>
  </div>
  <div class="clock" id="clock" aria-live="off">10:00</div>
  <div class="bar" role="progressbar" aria-label="Verstrichene Zeit"><div class="bar-fill" id="barFill"></div></div>

  <div class="blocks" id="blocks"></div>

  <div class="controls">
    <button id="startBtn" class="primary" title="Start / Pause (Leertaste)">Start</button>
    <button id="minusBtn" title="Eine Minute weniger (−)">−1 Min</button>
    <button id="plusBtn" title="Eine Minute mehr (+)">+1 Min</button>
    <button id="resetBtn" title="Neu starten (R)">Zurücksetzen</button>
  </div>

  <div class="row">
    <button class="chip" id="fsBtn" title="Vollbild (F)">Vollbild</button>
    <button class="chip" id="soundBtn" aria-pressed="true">Gong an</button>
    <button class="chip" id="testBtn">Ton testen</button>
    <span class="keys"><kbd>Leertaste</kbd> Start/Pause · <kbd>1</kbd>–<kbd>4</kbd> Blöcke · <kbd>+</kbd>/<kbd>−</kbd> Minute · <kbd>R</kbd> Zurücksetzen · <kbd>F</kbd> Vollbild</span>
  </div>

  <img class="logo-icon" src="dec-logo.png" alt="DEC">
</main>

<script>
(() => {
  const BLOCKS = [5, 10, 15, 30];
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("dec-timer-" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("dec-timer-" + k, JSON.stringify(v)); } catch {} }
  };

  const S = { min: store.get("min", 10), sound: store.get("sound", true), running: false, endAt: 0, remaining: 0, warned: false, rang: false };
  if (!BLOCKS.includes(S.min)) S.min = 10;
  const duration = () => S.min * 60000;
  const remainingNow = () => S.running ? S.endAt - Date.now() : S.remaining;

  // ---- Ton (Web Audio, erst nach einem Klick erlaubt) ----
  let ac;
  function audio() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(partials, len, vol, delay = 0) {
    const c = audio(); if (!c) return;
    const t = c.currentTime + delay;
    partials.forEach(([f, g]) => {
      const o = c.createOscillator(), v = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      v.gain.setValueAtTime(0.0001, t);
      v.gain.exponentialRampToValueAtTime(vol * g, t + 0.015);
      v.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(v).connect(c.destination); o.start(t); o.stop(t + len + 0.05);
    });
  }
  const gong = () => { const p = [[196, 1], [392, .45], [587, .3], [830, .18], [1175, .08]]; tone(p, 4.5, .5); tone(p, 4.5, .35, 1.4); };
  const chime = () => tone([[880, 1], [1320, .35]], 1.4, .22);

  // ---- Bildschirm wach halten ----
  let wake = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.running) keepAwake(); });

  // ---- Steuerung ----
  function start() { if (S.running) return; audio(); keepAwake(); S.endAt = Date.now() + S.remaining; S.running = true; render(); }
  function pause() { if (!S.running) return; S.remaining = S.endAt - Date.now(); S.running = false; render(); }
  function toggle() { S.running ? pause() : start(); }
  function reset() { S.running = false; S.remaining = duration(); S.warned = S.rang = false; render(); }
  function adjust(min) {
    if (S.running) S.endAt += min * 60000; else S.remaining += min * 60000;
    const r = remainingNow(); S.rang = r <= 0; S.warned = r <= 60000; render();
  }
  function pick(min) { S.min = min; store.set("min", min); reset(); start(); }

  // ---- Anzeige ----
  function fmt(ms) {
    const abs = ms < 0 ? Math.floor(-ms / 1000) : Math.ceil(ms / 1000);
    const h = Math.floor(abs / 3600), m = Math.floor((abs % 3600) / 60), sec = abs % 60;
    return h ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}` : `${m}:${String(sec).padStart(2, "0")}`;
  }
  const digits = t => [...t].map(c => `<span class="${/\d/.test(c) ? "d" : "s"}">${c}</span>`).join("");

  function tick() {
    const r = remainingNow();
    if (S.running) {
      if (!S.warned && r <= 60000 && r > 0 && duration() > 120000) { S.warned = true; if (S.sound) chime(); }
      if (!S.rang && r <= 0) { S.rang = true; if (S.sound) gong(); }
    }
    render();
  }

  function render() {
    const r = remainingNow(), d = duration();
    const over = r <= 0 && (S.running || S.rang);
    const state = over ? "over" : !S.running && r < d ? "paused" : S.running && r <= Math.min(120000, d * 0.25) ? "warn" : S.running ? "run" : "idle";
    $("stage").dataset.state = state;

    // Abgelaufen: Uhr bleibt auf 0:00, die überzogene Zeit steht im Status
    $("clock").innerHTML = digits(over ? "0:00" : fmt(r));
    $("status").textContent = over ? `Zeit ist um · ${fmt(r)} überzogen`
      : state === "paused" ? "Pausiert" : S.running ? `Läuft · ${S.min}-Minuten-Block` : "Bereit";
    $("barFill").style.width = Math.max(0, Math.min(1, 1 - r / d)) * 100 + "%";
    $("startBtn").textContent = S.running ? "Pause" : (r < d ? "Fortsetzen" : "Start");
    [...$("blocks").children].forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.min) === S.min));
    document.title = S.running || r < d ? `${over ? "Zeit ist um" : fmt(r)} · DEC Timer` : "DEC Workshop-Timer";
  }

  // ---- Buttons & Tastatur ----
  BLOCKS.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "block"; b.dataset.min = m; b.title = `${m} Minuten starten (${i + 1})`;
    b.innerHTML = `<b>${m}</b><span>Minuten</span>`;
    b.onclick = () => pick(m); $("blocks").appendChild(b);
  });
  $("startBtn").onclick = toggle;
  $("resetBtn").onclick = reset;
  $("plusBtn").onclick = () => adjust(1);
  $("minusBtn").onclick = () => adjust(-1);
  function fullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
      else document.documentElement.requestFullscreen?.().catch(() => {});
    } catch {}
  }
  $("fsBtn").onclick = fullscreen;
  function syncSound() { $("soundBtn").setAttribute("aria-pressed", S.sound); $("soundBtn").textContent = S.sound ? "Gong an" : "Gong aus"; }
  $("soundBtn").onclick = () => { S.sound = !S.sound; store.set("sound", S.sound); syncSound(); };
  $("testBtn").onclick = gong;

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === " ") { e.preventDefault(); toggle(); }
    else if (k >= "1" && k <= "4") pick(BLOCKS[Number(k) - 1]);
    else if (k === "+" || k === "=") adjust(1);
    else if (k === "-") adjust(-1);
    else if (k === "r") reset();
    else if (k === "f") fullscreen();
  });

  S.remaining = duration();
  syncSound(); render();
  setInterval(tick, 250);
})();
</script>

</body>
</html>
